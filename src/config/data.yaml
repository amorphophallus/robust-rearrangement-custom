data:
  test_split: 0.05
  data_subset: null
  # Validated on local zstd LMDB storage: four workers per rank outperformed
  # higher reader counts, while persistent workers avoid per-epoch restarts.
  dataloader_workers: 4
  persistent_workers: true
  prefetch_factor: 2
  async_device_prefetch: false
  pred_horizon: ${pred_horizon}
  obs_horizon: ${obs_horizon}
  action_horizon: ${action_horizon}
  predict_past_actions: ${predict_past_actions}
  augment_image: true
  # 引导信息
  annotate_guidance_point: false
  annotate_guidance_point_colored: false
  annotate_grasp: false
  annotate_grasp_colored: false
  annotate_grasp_part: false
  annotate_skill_one_hot: false
  # Metadata for datasets generated with noisy visual guidance annotations.
  # These values are recorded in the training config; the dataset suffix selects
  # the actual clean/noisy LMDB.
  annotation_noise_pos_std_m: 0.0
  annotation_noise_ori_std_deg: 0.0
  annotation_noise_seed: 0
  annotation_noise_mode: gaussian_clip_2sigma
  annotation_noise_apply_to: all
  environment: ${environment}
  task: ${task}
  demo_source: ${demo_source}
  randomness: ${randomness}
  normalization: min_max # min_max, mean_std, none
  demo_outcome: ${demo_outcome}
  pad_after: true
  suffix: null
  suffix_fallback: null
  include_future_obs: false
  minority_class_power: false
  # Optional exact per-epoch sampling weights keyed by the pickle top-level
  # `env` value, e.g. {FurnitureBench: 0.5, AutoMate: 0.35, ManiSkill: 0.15}.
  # Supported by single-GPU bc.py and by multi-rank bc_ddp.py when
  # ddp_shard_enabled=true. It cannot be combined with minority_class_power.
  # Every selected episode must have a non-empty env value in dataset metadata.
  # The new LMDB converter writes it; Zarr inputs must already provide it.
  env_sampling_weights: null
  data_paths_override: null
  storage_format: zarr
  load_into_memory: auto
  ddp_shard_enabled: false
  ddp_split_unit: episode
  ddp_shard_balance: frames
  ddp_validation_mode: rank0_full
  parts_poses_in_robot_frame: ${parts_poses_in_robot_frame}
