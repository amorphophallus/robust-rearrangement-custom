<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="940" viewBox="0 0 1800 940">
  <defs>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#536779"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#E76F51"/></marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2A9D8F"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif}.h{font-weight:700;fill:#17324D}.p{fill:#42566A}.small{font-size:15px}.body{font-size:17px}.panel{stroke-width:2}.box{stroke-width:2}</style>
  </defs>
  <rect width="1800" height="940" fill="#FFFFFF"/>
  <text x="45" y="50" font-size="30" class="h">What should a VLM tell an action expert?</text>
  <rect x="40" y="85" width="500" height="790" rx="18" fill="#FFF8F5" stroke="#E76F51" class="panel"/>
  <text x="64" y="122" font-size="21" font-weight="700" fill="#8C3B2B">a  Why explicit guidance?</text>
  <rect x="76" y="175" width="115" height="68" rx="12" fill="#FFFFFF" stroke="#8FA3B8" class="box"/>
  <rect x="232" y="175" width="115" height="68" rx="12" fill="#FDE9E3" stroke="#E76F51" class="box"/>
  <rect x="388" y="175" width="115" height="68" rx="12" fill="#FDE9E3" stroke="#E76F51" class="box"/>
  <text x="133" y="204" text-anchor="middle" class="body p"><tspan x="133">Observation</tspan><tspan x="133" dy="21" font-weight="700">t</tspan></text>
  <text x="289" y="204" text-anchor="middle" class="body" fill="#8C3B2B"><tspan x="289">Action</tspan><tspan x="289" dy="21">error</tspan></text>
  <text x="445" y="204" text-anchor="middle" class="body" fill="#8C3B2B"><tspan x="445">Shifted state</tspan><tspan x="445" dy="21" font-weight="700">t+1</tspan></text>
  <line x1="191" y1="209" x2="227" y2="209" stroke="#E76F51" stroke-width="3" marker-end="url(#arrow-red)"/>
  <line x1="347" y1="209" x2="383" y2="209" stroke="#E76F51" stroke-width="3" marker-end="url(#arrow-red)"/>
  <rect x="85" y="285" width="410" height="82" rx="13" fill="#FDE9E3" stroke="#E76F51" class="box"/>
  <text x="290" y="318" text-anchor="middle" class="body" fill="#8C3B2B"><tspan x="290">Small control errors change later observations</tspan><tspan x="290" dy="23">and can propagate through a long horizon.</tspan></text>
  <rect x="85" y="435" width="410" height="86" rx="13" fill="#E8F6F3" stroke="#2A9D8F" class="box"/>
  <text x="290" y="469" text-anchor="middle" class="body" fill="#176B62"><tspan x="290" font-weight="700">VLM re-grounds from the current image</tspan><tspan x="290" dy="24">stage semantics + image-space target</tspan></text>
  <line x1="290" y1="521" x2="290" y2="558" stroke="#2A9D8F" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <rect x="85" y="563" width="410" height="110" rx="13" fill="#FFFFFF" stroke="#2A9D8F" class="box"/>
  <text x="290" y="598" text-anchor="middle" class="body" fill="#176B62"><tspan x="290" font-weight="700">External target reference</tspan><tspan x="290" dy="25" class="small" fill="#536779">may be inaccurate, but is not recursively</tspan><tspan x="290" dy="20" class="small" fill="#536779">generated from prior policy actions</tspan></text>
  <rect x="110" y="735" width="360" height="60" rx="12" fill="#FFF4D6" stroke="#D5A021" class="box"/>
  <text x="290" y="771" text-anchor="middle" class="small" font-weight="700" fill="#6E5313">Guidance does not remove downstream control error.</text>

  <rect x="565" y="85" width="555" height="790" rx="18" fill="#F7F9FC" stroke="#73879C" class="panel"/>
  <text x="590" y="122" font-size="21" font-weight="700" fill="#30475E">b  What information is exposed?</text>
  <text x="595" y="170" class="small" font-weight="700" fill="#536779">Interface</text>
  <text x="898" y="170" class="small" font-weight="700" fill="#536779" text-anchor="middle">Semantic</text>
  <text x="995" y="170" class="small" font-weight="700" fill="#536779" text-anchor="middle">Spatial</text>
  <text x="1070" y="170" class="small" font-weight="700" fill="#536779" text-anchor="middle">Pose</text>
  <g>
    <rect x="590" y="190" width="505" height="82" rx="12" fill="#F1EBF7" stroke="#7B61A8" class="box"/>
    <text x="610" y="222" class="body h">Skill condition</text><text x="610" y="248" class="small p">5D one-hot</text>
    <text x="898" y="239" font-size="24" fill="#7B61A8" text-anchor="middle">●</text><text x="995" y="239" font-size="23" fill="#8796A5" text-anchor="middle">–</text><text x="1070" y="239" font-size="23" fill="#8796A5" text-anchor="middle">–</text>
    <rect x="590" y="290" width="505" height="82" rx="12" fill="#EAF2FB" stroke="#3F78B5" class="box"/>
    <text x="610" y="322" class="body h">Guidance point (GP)</text><text x="610" y="348" class="small p">2D location</text>
    <text x="898" y="339" font-size="24" fill="#3F78B5" text-anchor="middle">○</text><text x="995" y="339" font-size="24" fill="#3F78B5" text-anchor="middle">●</text><text x="1070" y="339" font-size="23" fill="#8796A5" text-anchor="middle">–</text>
    <rect x="590" y="390" width="505" height="88" rx="12" fill="#E8F6F3" stroke="#2A9D8F" stroke-width="4"/>
    <text x="610" y="424" class="body h">TAGPoint</text><text x="610" y="450" class="small p">color + 2D location</text>
    <text x="898" y="442" font-size="24" fill="#2A9D8F" text-anchor="middle">●</text><text x="995" y="442" font-size="24" fill="#2A9D8F" text-anchor="middle">●</text><text x="1070" y="442" font-size="23" fill="#8796A5" text-anchor="middle">–</text>
    <rect x="590" y="496" width="505" height="82" rx="12" fill="#FFF1E8" stroke="#E58B47" class="box"/>
    <text x="610" y="528" class="body h">GP + skill</text><text x="610" y="554" class="small p">information-rich reference</text>
    <text x="898" y="545" font-size="24" fill="#E58B47" text-anchor="middle">●</text><text x="995" y="545" font-size="24" fill="#E58B47" text-anchor="middle">●</text><text x="1070" y="545" font-size="23" fill="#8796A5" text-anchor="middle">–</text>
    <rect x="590" y="596" width="505" height="82" rx="12" fill="#FDEDEC" stroke="#C95A65" class="box"/>
    <text x="610" y="628" class="body h">6D grasp annotation</text><text x="610" y="654" class="small p">location + orientation</text>
    <text x="898" y="645" font-size="24" fill="#C95A65" text-anchor="middle">○</text><text x="995" y="645" font-size="24" fill="#C95A65" text-anchor="middle">●</text><text x="1070" y="645" font-size="24" fill="#C95A65" text-anchor="middle">●</text>
  </g>
  <rect x="620" y="740" width="445" height="82" rx="12" fill="#FFFFFF" stroke="#17324D" class="box"/>
  <text x="842" y="773" text-anchor="middle" class="body h"><tspan x="842">Which interface improves action generation</tspan><tspan x="842" dy="23">and tolerates imperfect guidance?</tspan></text>

  <rect x="1145" y="85" width="615" height="790" rx="18" fill="#F4F8FD" stroke="#3F78B5" class="panel"/>
  <text x="1170" y="122" font-size="21" font-weight="700" fill="#244F7A">c  End-to-end system</text>
  <rect x="1190" y="165" width="180" height="76" rx="12" fill="#FFFFFF" stroke="#8FA3B8" class="box"/>
  <text x="1280" y="196" text-anchor="middle" class="body p"><tspan x="1280">Current RGB image</tspan><tspan x="1280" dy="22">+ instruction</tspan></text>
  <rect x="1480" y="165" width="220" height="76" rx="12" fill="#EAF2FB" stroke="#3F78B5" class="box"/>
  <text x="1590" y="194" text-anchor="middle" class="body" fill="#244F7A"><tspan x="1590" font-weight="700">VLM</tspan><tspan x="1590" dy="23">semantic + spatial grounding</tspan></text>
  <line x1="1370" y1="203" x2="1475" y2="203" stroke="#536779" stroke-width="3" marker-end="url(#arrow-gray)"/>
  <rect x="1295" y="290" width="315" height="88" rx="13" fill="#E8F6F3" stroke="#2A9D8F" stroke-width="4"/>
  <text x="1452" y="323" text-anchor="middle" class="body" fill="#176B62"><tspan x="1452" font-weight="700">TAGPoint</tspan><tspan x="1452" dy="24">(u,v) + color-coded action mode</tspan></text>
  <line x1="1590" y1="241" x2="1532" y2="286" stroke="#2A9D8F" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <rect x="1340" y="405" width="225" height="52" rx="11" fill="#FFF4D6" stroke="#D5A021" class="box"/>
  <text x="1452" y="437" text-anchor="middle" class="small" fill="#6E5313">semantic error  |  spatial error</text>
  <rect x="1190" y="510" width="180" height="78" rx="12" fill="#FFFFFF" stroke="#8FA3B8" class="box"/>
  <text x="1280" y="541" text-anchor="middle" class="body p"><tspan x="1280">Marked RGB-D</tspan><tspan x="1280" dy="22">+ robot state</tspan></text>
  <rect x="1480" y="510" width="220" height="78" rx="12" fill="#EAF2FB" stroke="#3F78B5" class="box"/>
  <text x="1590" y="539" text-anchor="middle" class="body" fill="#244F7A"><tspan x="1590" font-weight="700">Shared DiT action expert</tspan><tspan x="1590" dy="23">continuous action denoising</tspan></text>
  <line x1="1370" y1="549" x2="1475" y2="549" stroke="#536779" stroke-width="3" marker-end="url(#arrow-gray)"/>
  <rect x="1340" y="650" width="225" height="76" rx="12" fill="#F1EBF7" stroke="#7B61A8" class="box"/>
  <text x="1452" y="681" text-anchor="middle" class="body" fill="#5B4783"><tspan x="1452">Receding-horizon</tspan><tspan x="1452" dy="22">action chunk</tspan></text>
  <line x1="1590" y1="588" x2="1540" y2="645" stroke="#7B61A8" stroke-width="3" marker-end="url(#arrow-gray)"/>
  <rect x="1240" y="780" width="425" height="55" rx="12" fill="#FFFFFF" stroke="#3F78B5" class="box"/>
  <text x="1452" y="814" text-anchor="middle" class="body" font-weight="700" fill="#244F7A">Execute → observe again → refresh guidance</text>
</svg>
